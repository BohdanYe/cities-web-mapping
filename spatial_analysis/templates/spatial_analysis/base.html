<!DOCTYPE html>
<html lang="en">
<head>

    <title>
        {% block title %}
        Dublin Spatial Analysis
        {% endblock %}

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"

            🗺 Dublin Spatial Analysis

        <div class="navbar-nav ms-auto">

            </a>

            <a class="nav-link"

            </a>

        </div>
    </div>

<footer>
